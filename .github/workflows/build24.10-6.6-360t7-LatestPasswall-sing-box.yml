#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/build24.10-6.6-360t7-LatestPasswall-sing-box.yml
# Description: Build immortalwrt24.10-6.6 360T7 Passwall+Sing-box (+ UA3F)
#
# 结构对齐已验证仓库 HASH512512/immortalwrt-mt7981-cudy-tr3000 的 openwrt-builder.yml：
#   - 纯 make 流程，不手工干预 toolchain / 不手工预构建 host 工具
#   - jlumbroso/free-disk-space 释放磁盘
#   - ccache + dl 缓存（actions/cache）
#   - make -j$(nproc) CC="ccache gcc" CXX="ccache g++"，失败回退 make -j1 V=s
#

name: Build immortalwrt24.10-6.6 360T7 Latest Passwall+Sing-box

permissions:
  contents: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      build_ua3f:
        description: "是否编译 UA3F 插件 (true/false)"
        required: false
        default: "true"
      ua3f_ref:
        description: "UA3F 分支/tag/commit，留空或 master 取最新"
        required: false
        default: "master"
      extra_repos:
        description: '临时追加插件源码，格式 "URL|REF|目标目录"，多条用 ; 分隔'
        required: false
        default: ""
      extra_packages:
        description: "临时追加启用的包，空格或逗号分隔，如 luci-theme-argon luci-app-ttyd"
        required: false
        default: ""

env:
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 2G
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 2410-6.6-360t7-passwall-sing-box.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: 2410-6.6-diy-part2-6-1-pw.sh
  CUSTOM_PKG_SH: diy-part2-custom.sh
  ENABLE_UA3F: ${{ github.event.inputs.build_ua3f || 'true' }}
  UA3F_REF: ${{ github.event.inputs.ua3f_ref || 'master' }}
  EXTRA_REPOS: ${{ github.event.inputs.extra_repos }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
  RELEASE_FILE: 2410-6.6-pw-release.txt
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Setup ccache & DL cache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-${{ hashFiles('2410-6.6-360t7-passwall-sing-box.config', 'custom-packages.list', 'diy-part1.sh', 'diy-part2-custom.sh') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache -z

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # UA3F 要求 go >= 1.23
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

          # 移除 openwrt feeds 自带的核心库
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls}
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages

          # 移除 openwrt feeds 过时的 luci 版本
          rm -rf feeds/luci/applications/luci-app-passwall
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci

      - name: Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Enable custom packages
        run: |
          chmod +x $CUSTOM_PKG_SH
          cd openwrt
          $GITHUB_WORKSPACE/$CUSTOM_PKG_SH

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          if [ "${ENABLE_UA3F}" = "true" ]; then
            grep -q '^CONFIG_PACKAGE_ua3f=y' .config || { echo "::error::UA3F 未进入 .config，请检查 luci-compat / iptables / ipset 依赖"; exit 1; }
          fi
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          if ! make -j$(nproc) CC="ccache gcc" CXX="ccache g++"; then
            echo "多线程编译失败，回退单线程重试..."
            make -j1 V=s || make -j1 V=s
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          if [ "${ENABLE_UA3F}" = "true" ]; then
            echo "---- ua3f 相关 ipk ----"
            find bin/packages -name 'ua3f*.ipk' -exec ls -lh {} \; 2>/dev/null || true
            UA3F_VER=$(sed -n 's/^PKG_VERSION:=//p' package/UA3F/openwrt/Makefile | head -1)
            echo "UA3F_VER=${UA3F_VER}" >> $GITHUB_ENV
          fi
          ccache -s || true
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch "${RELEASE_FILE}"
          if [ "${ENABLE_UA3F}" = "true" ]; then
            printf '\n内置插件：UA3F %s（LuCI 路径：服务 → UA3F；默认监听 1080，服务模式 SOCKS5/HTTP/TPROXY/REDIRECT/NFQUEUE）\n' "${UA3F_VER:-unknown}" >> "${RELEASE_FILE}"
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: ${{ env.RELEASE_FILE }}
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 12
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
